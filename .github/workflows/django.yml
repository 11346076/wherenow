name: Django CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: test
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Log Files
        run: |
          cd /home/xinmei/projects/wherenow
          mkdir -p logs
          touch logs/django.log
          touch logs/error.log
          chmod 777 logs
          chmod 666 logs/django.log
          chmod 666 logs/error.log

      - name: Install Dependencies
        run: |
          cd /home/xinmei/projects/wherenow
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          cd /home/xinmei/projects/wherenow
          source venv/bin/activate
          pytest --ds=wherenow.ci_settings

      - name: Deploy to Linux and Restart Apache
        if: github.event_name == 'push'
        run: |
          cd /home/xinmei/projects/wherenow

          git fetch origin
          git reset --hard origin/main
          git clean -fd -e logs/ -e media/ -e staticfiles/

          mkdir -p logs
          touch logs/django.log
          touch logs/error.log
          chmod 777 logs
          chmod 666 logs/django.log
          chmod 666 logs/error.log

          source venv/bin/activate
          pip install -r requirements.txt

          python manage.py check
          python manage.py migrate
          python manage.py collectstatic --noinput

          sudo systemctl restart apache2