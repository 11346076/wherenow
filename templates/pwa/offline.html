{% load static %}
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f2d36">
  <title>WhereNow Offline</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f7f4ef;
      color: #1f2d36;
      font-family: "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
    }

    .offline-card {
      width: min(92vw, 520px);
      padding: 36px;
      border: 1px solid #eadfd2;
      border-radius: 24px;
      background: #fffdf9;
      box-shadow: 0 16px 34px rgba(61, 48, 38, 0.08);
      text-align: center;
    }

    .offline-card h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    .offline-card p {
      margin: 0 0 22px;
      color: #66757c;
      line-height: 1.8;
    }

    .offline-card a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      background: #1f2d36;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <h1>WhereNow 離線模式</h1>
    <p>目前無法連線到伺服器。請確認網路狀態後重新整理，已快取的頁面與靜態資源仍可離線瀏覽。</p>
    <a href="/home/">返回首頁</a>
  </main>
</body>
</html>
