{% load i18n %}
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入失敗 - WhereNow</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      background: #f7f4ef; color: #1f2a30; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 40px 24px;
    }
    .card {
      width: 100%; max-width: 480px; background: rgba(255,255,255,0.72);
      border: 1px solid #e5ddd2; border-radius: 32px; padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(31,42,48,0.08); text-align: center;
    }
    h1 { font-size: 28px; margin: 0 0 12px; color: #d64545; }
    p { font-size: 16px; color: #55646f; margin: 0 0 24px; line-height: 1.6; }
    .btn {
      display: inline-block; padding: 14px 32px; border-radius: 999px;
      background: #1f2a30; color: #fff; text-decoration: none; font-weight: 600;
    }
    .btn:hover { background: #142029; }
  </style>
</head>
<body>
  <div class="card">
    <h1>登入失敗</h1>
    <p>
      Google 登入過程中發生問題，可能是連線中斷或 session 過期。<br>
      請返回登入頁面重新嘗試。
    </p>
    <a href="{% url 'account_login' %}" class="btn">返回登入頁</a>
  </div>
</body>
</html>
