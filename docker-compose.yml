services:
  db:
    image: mariadb:11
    container_name: wherenow-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wherenow}
      MARIADB_USER: ${DB_USER:-wherenow}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wherenow_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-wherenow_root_password}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: wherenow-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - wherenow-data:/app/data
      - ./media:/app/media
      - ./logs:/app/logs
      - staticfiles:/app/staticfiles
    command: >
      /bin/sh -c "
      mkdir -p /app/logs /app/data &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py setup_admin_user &&
      SITE_DOMAIN=\"$${SITE_DOMAIN:-127.0.0.1:8000}\" &&
      python manage.py setup_social_app --domain \"$$SITE_DOMAIN\" &&
      exec gunicorn wherenow.wsgi:application --bind 0.0.0.0:8000 --workers 4
      "

  nginx:
    image: nginx:1.27-alpine
    container_name: wherenow-nginx
    depends_on:
      - web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      - ./logs/nginx:/var/log/nginx

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wherenow-tunnel
    depends_on:
      - nginx
    restart: unless-stopped
    volumes:
      - ./.cloudflared:/etc/cloudflared:ro
    command:
      - tunnel
      - --protocol
      - http2
      - --config
      - /etc/cloudflared/config.yml
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  wherenow-data:
  mariadb-data:
  staticfiles:
