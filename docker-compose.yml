services:
  web:
    build: .
    container_name: wherenow-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - wherenow-data:/app/data
      - ./media:/app/media
      - ./logs:/app/logs
    command: >
      /bin/sh -c "
      mkdir -p /app/logs /app/data &&
      python manage.py migrate --noinput &&
      SITE_DOMAIN=\"$${SITE_DOMAIN:-127.0.0.1:8000}\" &&
      python manage.py setup_social_app --domain \"$$SITE_DOMAIN\" &&
      exec gunicorn wherenow.wsgi:application --bind 0.0.0.0:8000 --workers 4
      "

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wherenow-tunnel
    depends_on:
      - web
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    command:
      - tunnel
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
      - --url
      - http://web:8000

volumes:
  wherenow-data:
