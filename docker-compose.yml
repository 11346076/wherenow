services:
  web:
    build: .
    container_name: wherenow-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - wherenow-data:/app/data
      - ./media:/app/media
      - ./logs:/app/logs
    command: >
      /bin/sh -c "
      mkdir -p /app/logs /app/data &&
      python manage.py migrate --noinput &&
      python manage.py setup_admin_user &&
      SITE_DOMAIN=\"$${SITE_DOMAIN:-127.0.0.1:8000}\" &&
      python manage.py setup_social_app --domain \"$$SITE_DOMAIN\" &&
      exec gunicorn wherenow.wsgi:application --bind 0.0.0.0:8000 --workers 4
      "

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wherenow-tunnel
    depends_on:
      - web
    restart: unless-stopped
    volumes:
      - ./.cloudflared:/etc/cloudflared:ro
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  wherenow-data:
